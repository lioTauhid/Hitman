[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hitman"
version = "0.1.0"
description = "A lightweight desktop API client. No account, no cloud, local only."
readme = "README.md"
license = "LGPL-2.1-only"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "requests>=2.32",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hitman = "hitman.app:main"

[tool.setuptools.packages.find]
include = ["hitman*"]

[tool.setuptools.package-data]
hitman = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
